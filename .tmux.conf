#{{{ 启动Tmux Plugin Manager
# 这句 tmux 配置语句必须放在 .tmux.conf 文件的最后
# 这是因为它负责初始化 tmux 插件管理器 tpm（Tmux Plugin Manager），
# 并且插件的加载和初始化需要在所有其他 tmux 配置命令之后进行。
run '~/.tmux/plugins/tpm/tpm'
#}}} 启动Tmux Plugin Manager

#}}} 安装插件
