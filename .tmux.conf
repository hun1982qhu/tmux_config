#{{{ 自定义状态栏（status bar）配置模板
######################################################################################################################################################

#{{{ 定义名为 wg_prfx 的变量。
# #{?client_prefix,<Prefix>,} 是一个条件表达式，它会在你按下前缀键（通常是 Ctrl-b，除非你重新绑定了前缀键）时显示 <Prefix> 字样。如果没有按下前缀键，这部分内容将不会显示。
# 这个变量的作用是在状态栏中显示 <Prefix>，用来提醒你当前处于前缀键模式。
#======================================================================================================================================================
# wg_prfx=" #{?client_prefix,<Prefix>,}"
#}}} 定义名为 wg_prfx 的变量。

#{{{ 定义名为 wg_date 的变量
# #[fg=color231,bold,italics,bg=default] 是一个格式化字符串，设置了日期显示的前景色为 color231（通常是白色），字体为粗体和斜体，背景色为默认颜色。
# %d-%b-%Y 是日期格式，显示为 日-月-年（例如 09-Jul-2024）。
# #[none] 取消了前面的格式设置，恢复到默认状态。
# wg_date=" #[fg=color231,bold,italics,bg=default]%d-%b-%Y#[none]"
#}}} 定义名为 wg_date 的变量

#{{{ 定义名为 wg_time 的变量
# #[fg=color220,bold,bg=default] 设置了时间显示的前景色为 color220（通常是黄色），字体为粗体，背景色为默认颜色。
# %H:%M 是时间格式，显示为 小时:分钟（例如 14:30）。
# wg_time=" #[fg=color220,bold,bg=default]%H:%M"
#}}} 定义名为 wg_time 的变量

#{{{ 这行命令将状态栏的右侧内容设置为前面定义的三个变量的组合。
# ${wg_prfx}${wg_date}${wg_time} 将前缀提示、日期和时间按顺序显示在状态栏的右侧。
# set -g status-right "${wg_prfx}${wg_date}${wg_time}"
#}}} 这行命令将状态栏的右侧内容设置为前面定义的三个变量的组合。

#}}} 自定义状态栏（status bar）配置模板

#{{{ 安装插件
######################################################################################################################################################

#{{{ 安装 Tmux Plugin Manager
set -g @plugin 'tmux-plugins/tpm'
#}}} 安装 Tmux Plugin Manager

#{{{ 安装和配置Tmux Resurrect

#{{{ 安装
# tmux-resurrect 插件的作用是使 tmux 会话能够在重启后恢复。
# 它可以保存并恢复所有的 tmux 会话，包括窗口、窗格及其布局和状态，甚至包括当前正在运行的程序。
set -g @plugin 'tmux-plugins/tmux-resurrect'
#}}} 安装

#{{{ 配置
# @resurrect-capture-pane-contents 是 tmux-resurrect 插件的一个选项。
# set -g 是 tmux 的全局设置命令，表示设置一个全局选项。
# on 是将该选项启用。
# 启用 @resurrect-capture-pane-contents 选项后，在使用 tmux-resurrect 插件保存会话时，它会捕获并保存每个 pane 的内容。
# 这意味着，当你恢复会话时，不仅会恢复窗口和 pane 的布局，还会恢复每个 pane 中的内容。这在你希望在恢复会话时能看到之前的终端输出时非常有用。
# 所以，set -g @resurrect-capture-pane-contents 'on' 的作用是启用捕获并保存每个 pane 内容的功能，使会话恢复时更加完整。
set -g @resurrect-capture-pane-contents 'on'
# 这个命令配置 tmux-resurrect 插件，在保存和恢复 vim 会话时，使用 vim 的会话文件（session file）。
# 会话文件可以保存 vim 的所有状态（如打开的文件、光标位置等），使得 vim 在恢复时能够回到上次离开的状态。
set -g @resurrect-strategy-vim 'session'
# 这个命令与上一个类似，但用于 neovim (nvim)。
# 它配置 tmux-resurrect 插件，在保存和恢复 neovim 会话时，使用 neovim 的会话文件。
set -g @resurrect-strategy-nvim 'session'
#}}} 配置

#}}} 安装和配置Tmux Resurrect

#{{{ 安装和配置Tmux Continuum

#{{{ 安装
# tmux-continuum 插件的作用是自动管理 tmux-resurrect 的保存和恢复功能。
# 它可以定期自动保存 tmux 会话，并在 tmux 启动时自动恢复之前的会话。除此之外，tmux-continuum 还可以在系统重启后自动启动 tmux。
set -g @plugin 'tmux-plugins/tmux-continuum'
#}}} 安装

#{{{ 配置
# 启用 tmux-continuum 插件的自动恢复功能。
# 当你重新启动 tmux 或系统时，它会自动恢复上一次保存的会话状态，包括窗口和 pane 的布局、运行的命令等。
# 具体作用：
# tmux-continuum 插件：这个插件扩展了 tmux-resurrect 的功能，增加了自动保存和恢复会话的功能。它会定期自动保存当前的会话状态，并且在 tmux 启动时自动恢复上一次的状态。
# tmux-resurrect 插件：这是一个被 tmux-continuum 依赖的插件，用于保存和恢复 tmux 会话的状态。它可以保存当前所有窗口和 pane 的布局、正在运行的程序、滚动缓冲区内容等，并在恢复时还原这些状态。
# 通过这两行配置，当你使用 tmux 时，tmux-continuum 插件会自动保存你的会话状态，并在重新启动 tmux 时自动恢复之前的状态，从而提高了使用 tmux 的便利性和连续性。
set -g @continum-restore 'on'
#}}} 配置

#}}} 安装和配置Tmux Continuum

#{{{ 安装Tmux Sensible
# tmux-sensible 插件的作用：
# 提供合理的默认配置：
# 该插件包含了一组经过社区验证的默认设置，可以提升 tmux 的用户体验。例如，它可能包含一些有用的快捷键绑定、默认的窗口命名规则、更合理的鼠标支持等。
# 简化配置过程：
# 安装 tmux-sensible 插件后，你可以避免手动编写一些常见的配置选项，因为插件已经为你预设了这些选项。这对于新手和希望快速配置 tmux 的用户来说非常方便。
# 提高可用性：
# 通过应用一组经过优化的默认设置，tmux-sensible 可以帮助用户更高效地使用 tmux，减少配置时间，并专注于实际工作。
set -g @plugin 'tmux-plugins/tmux-sensible'
#}}} 8.4 安装Tmux Sensible

#{{{ 安装vim-tmux-navigator
# 无缝导航：
# 该插件允许你使用相同的键绑定在 tmux 窗格和 Vim 窗口之间进行导航。
# 具体来说，你可以使用 Ctrl-h、Ctrl-j、Ctrl-k 和 Ctrl-l 来分别向左、下、上、右移动，无论你当前是在 tmux 窗格还是 Vim 窗口中。
# 这样，你不需要记住不同的键绑定来在不同的环境中进行导航，提高了效率和一致性。
set -g @plugin 'christoomey/vim-tmux-navigator'
#}}} 安装vim-tmux-navigator

#{{{ 安装tmux-pain-control
# tmux-pain-control 插件的作用：
# 简化 pane 管理：
# 该插件提供了一些默认的键绑定，用于快速创建、切换和关闭 tmux 窗格。这些键绑定比默认的 tmux 键绑定更加简洁和易记。
# 提高效率：
# 通过使用这些快捷键，你可以更高效地管理 tmux 窗格，减少操作步骤，从而提高工作效率。
set -g @plugin 'tmux-plugins/tmux-pain-control'
#}}} 安装tmux-pain-control

#{{{ 安装tmux-logging
# Logging of all output in the current pane
# After you start logging, everything that's typed and all the output will be saved to a file. Convenient for keeping track of your work.
# Current pane "Screen Capture"
# All the text visible in the current pane is saved to a file. Like a screenshot, but textual.
# Save a complete history of current pane
# Everything that has been typed and all the output since the creation of the current pane can be saved to a file.
# Clear pane history with prefix + alt + c
set -g @plugin 'tmux-plugins/tmux-logging'
#}}} 安装tmux-logging

