#{{{ 设置tmux快捷键
######################################################################################################################################################

#{{{  设置前缀键
# 这个命令的作用是取消绑定默认的 prefix 键 C-b（即 Ctrl+b）。
# 在 tmux 中，默认的前缀键是 Ctrl+b，通过前缀键，你可以发出各种 tmux 命令。
# 如果你不喜欢默认的前缀键，可以通过 unbind 命令取消它，然后绑定一个新的前缀键。
unbind C-b
# change leader key from Ctr-b to Ctr-n
set -g prefix C-n
bind C-n send-prefix
#}}}  设置前缀键

#{{{ 设置'r' 重新加载配置文件
# 这个命令的作用是取消绑定键 r。在 tmux 中，
# 按键绑定允许你使用特定的按键来执行特定的命令。
# 通过 unbind 命令，你可以解除某个按键与其命令的绑定。
unbind r
# 这个命令的作用是将键 r 绑定到一个新的命令上。
# 具体来说，当你按下 r 键时，tmux 会重新加载配置文件 ~/.tmux.conf。
# 这在你修改配置文件后不需要重启 tmux 会话就能应用新配置时非常有用。
bind r source-file ~/.tmux.conf;
#}}} 设置'r' 重新加载配置文件

#{{{ 设置清理当前窗口快捷键
# 需要先按下prefix键，然后再按下M-m
bind-key m send-keys 'clear' C-m
# 不需要先按下prefix键，直接按下M-m
bind-key -n M-o send-keys 'clear' C-m
#}}} 设置清理当前窗口快捷键

#{{{ 设置类vim的光标跳转快捷键
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
#}}} 设置类vim的光标跳转快捷键

#{{{ 设置shift+Alt+vim_keys切换窗口
bind-key -n M-H previous-window
bind-key -n M-L next-window
#}}} 设置shift+Alt+vim_keys切换窗口

#{{{ 设置分屏快捷键
bind-key '\' split-window -h
bind-key '-' split-window -v
#}}} 设置分屏快捷键

#}}} 设置tmux快捷键

#{{{ 全局设置

#{{{ 通过 resurrect 设置恢复保存窗口时自动清除历史记录
set -g @resurrect-restore-hook '/home/huangning/.tmux/clear_tmux_history.sh'
#}}} 通过 resurrect 设置恢复保存窗口时自动清除历史记录

#{{{ 3. 启动鼠标支持
# 这个命令用于启用 tmux 的鼠标支持。在启用鼠标支持后，你可以使用鼠标来进行许多操作，包括但不限于以下几项：
# 切换窗格：你可以用鼠标点击不同的窗格来激活它们。
# 调整窗格大小：你可以拖动窗格的边界来调整它们的大小。
# 选择和复制文本：你可以用鼠标选择文本，然后复制它。
# 启用鼠标支持后，tmux 的使用体验将更接近于图形用户界面（GUI）中的窗口管理器，使得一些操作更加直观和方便。
set -g mouse on
#}}} 3. 启动鼠标支持

#{{{ 设置状态栏的位置
set -g status-position bottom
# set -g status-position top
#}}} 设置状态栏的位置

#{{{ 设置按下prefix键后的等待时间
# 这句配置的作用是设置 tmux 的 escape 时间，即按下 prefix 键（通常是 Ctrl+b）后，tmux 等待接收下一个按键的时间间隔。具体来说：
# set -sg：这是 tmux 的一个命令，用于设置一个全局的服务器选项。-s 表示这是一个服务器级别的选项，-g 表示这是一个全局选项。
# escape-time：这是一个 tmux 选项，用于指定按下 prefix 键后等待接收下一个按键的时间间隔。
# 10：这是该选项的值，单位是毫秒（ms），表示 tmux 在接收到 prefix 键后会等待 10 毫秒来接收下一个按键。
# 详细说明：
# escape-time 选项控制的是 tmux 如何处理多字节的输入序列。当你按下 prefix 键后，tmux 需要知道接下来的按键是否属于一个多字节的键序列，例如某些功能键或快捷键。如果间隔时间过长，tmux 可能会误判并导致延迟或误触发。
# 将 escape-time 设置为较小的值（例如 10 毫秒）可以减少按键延迟，使得 tmux 响应更快。
# 默认值：
# 默认情况下，escape-time 的值是 500 毫秒。对于一些用户来说，这个值可能太高，会感觉到按键有延迟。因此，许多人会将其设置为一个较小的值来提高响应速度。
# 总之，set -sg escape-time 10 这句配置将 prefix 键后的等待时间设置为 10 毫秒，从而提高 tmux 的响应速度，使得用户在使用快捷键时感觉更流畅。
set -sg escape-time 10
#}}} 设置按下prefix键后的等待时间

#{{{ 启用焦点事件支持
# 这句配置的作用是启用 tmux 的焦点事件（focus events）支持。具体来说：
# set -g focus-events on
# set -g：这是 tmux 的一个命令，用于设置全局选项（全局配置适用于所有的 tmux 会话和窗口）。
# focus-events：这是一个 tmux 选项，用于启用或禁用焦点事件支持。
# on：这是该选项的值，表示启用焦点事件支持。
# 详细说明：
#
# 焦点事件：焦点事件是指当窗口或 pane 获得或失去焦点时，tmux 会发送通知给相应的应用程序。这对于一些需要知道焦点状态的应用程序（如 Vim、Emacs 等）非常有用。
# 启用后的效果：启用 focus-events 选项后，当你在不同的 tmux 窗格之间切换时，支持焦点事件的应用程序可以根据焦点的变化来调整其行为。例如，Vim 可以根据焦点状态来决定是否自动重新加载文件或刷新内容。
# 使用场景：启用焦点事件在使用 tmux 配合 Vim、Emacs 等编辑器时特别有用，因为这些编辑器可以根据焦点的变化执行一些自动化操作，从而提高用户的工作效率。
# 启用焦点事件可能会增加一些额外的开销，但对于大多数现代系统来说，这个开销是可以忽略不计的。总的来说，启用 focus-events 可以提供更好的用户体验，特别是当你在 tmux 中运行支持焦点事件的应用程序时。
#
# 通过配置 set -g focus-events on，你可以让 tmux 发送焦点事件通知，从而使得支持这种特性的应用程序能够感知到焦点的变化，并做出相应的反应。
set -g focus-events on
#}}} 启用焦点事件支持

#{{{ 设置iterm2的tab自动显示当前tmux session的名称
set-option -g set-titles on
set-option -g set-titles-string "#{session_name} - #{host}"
set-option -sa terminal-features ',$TERM:RGB'
#}}} 设置iterm2的tab自动显示当前tmux session的名称

